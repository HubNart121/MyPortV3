name: my-port-v2-offline

services:
  db:
    image: ghcr.io/infrastructure-as-code/postgres:15-alpine
    container_name: my-port-v2-offline-db
    environment:
      POSTGRES_PASSWORD: offline-postgres-password
      POSTGRES_DB: postgres
    volumes:
      - offline_postgres_data:/var/lib/postgresql/data
      - ./docker/db/01-init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
      - ./docker/db/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./docker/db/03-auto-stock-status.sql:/docker-entrypoint-initdb.d/03-auto-stock-status.sql:ro
      - ./docker/db/04-chronological-trade-recalculation.sql:/docker-entrypoint-initdb.d/04-chronological-trade-recalculation.sql:ro
      - ./docker/db/05-multi-port-symbol.sql:/docker-entrypoint-initdb.d/05-multi-port-symbol.sql:ro
      - ./docker/db/06-trading-fees.sql:/docker-entrypoint-initdb.d/06-trading-fees.sql:ro
      - ./docker/db/07-backup-schema-parity.sql:/docker-entrypoint-initdb.d/07-backup-schema-parity.sql:ro
      - ./docker/db/08-offline-files.sql:/docker-entrypoint-initdb.d/08-offline-files.sql:ro
      - ./docker/db/09-offline-restore.sql:/docker-entrypoint-initdb.d/09-offline-restore.sql:ro
      - ./docker/db/10-activity-logs.sql:/docker-entrypoint-initdb.d/10-activity-logs.sql:ro
      - ./docker/db/11-bank-accounts.sql:/docker-entrypoint-initdb.d/11-bank-accounts.sql:ro
      - ./docker/db/12-stock-country.sql:/docker-entrypoint-initdb.d/12-stock-country.sql:ro
      - ./docker/db/13-platform-trade.sql:/docker-entrypoint-initdb.d/13-platform-trade.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: ghcr.io/supabase/postgrest:v12.2.0
    container_name: my-port-v2-offline-postgrest
    environment:
      PGRST_DB_URI: postgres://authenticator:my-secret-authenticator-password@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-offline-jwt-key-with-at-least-32-characters
      PGRST_DB_MAX_ROWS: 50000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/nginx/nginx-unprivileged:alpine
    container_name: my-port-v2-offline-api
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - postgrest
    restart: unless-stopped

  upload-init:
    image: alpine:latest
    container_name: my-port-v2-offline-upload-init
    command: ["sh", "-c", "mkdir -p /data/uploads && chown -R 1001:1001 /data/uploads"]
    volumes:
      - offline_uploads:/data/uploads
    restart: "no"

  web:
    image: my-port-v2-offline:2026-08-02
    build:
      context: .
      dockerfile: Dockerfile.offline
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:3020
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NTY1MDAwMCwiZXhwIjo0MTAyNDQ0ODAwfQ.bG5ibF9RT4jmuRej4-xy91mfKAv7Jz5mXWavyon2B5g
    container_name: my-port-v2-offline-web
    environment:
      APP_MODE: offline
      NEXT_PUBLIC_APP_MODE: offline
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:3020
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NTY1MDAwMCwiZXhwIjo0MTAyNDQ0ODAwfQ.bG5ibF9RT4jmuRej4-xy91mfKAv7Jz5mXWavyon2B5g
      SUPABASE_SERVER_URL: http://api:8080
      APP_ORIGIN: http://localhost:3020
      LOCAL_UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - offline_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      upload-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db-ui:
    image: ghcr.io/djnotes/adminer:latest
    container_name: my-port-v2-offline-db-ui
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  offline_postgres_data:
    name: my-port-v2-offline-postgres
  offline_uploads:
    name: my-port-v2-offline-uploads
